        <meta name="application-name" content="Mappix" />
        <meta name="msapplication-TileColor" content="#D96C4A" />

        <!-- PWA Manifest -->
        <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

        <!-- Icons -->
        <link rel="icon" href="%PUBLIC_URL%/icons/icon-192x192.png" />
        <link rel="apple-touch-icon" href="%PUBLIC_URL%/icons/icon-192x192.png" />

        <!-- Fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600&display=swap" rel="stylesheet" />

        <!-- Google AdSense -->
        <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6371841208008674" crossorigin="anonymous"></script>

        <!-- Google Analytics 4 -->
        <script async src="https://www.googletagmanager.com/gtag/js?id=G-VZNMR09J0Z"></script>
        <script>
            window.dataLayer = window.dataLayer || [];
            function gtag(){dataLayer.push(arguments);}
            gtag('js', new Date());
            gtag('config', 'G-VZNMR09J0Z');
        </script>

        <title>Mappix</title>

        <!-- Hide Leaflet attribution (we have custom one on the left) -->
        <style>
            .leaflet-control-attribution {
                display: none !important;
            }
        </style>
        <script>window.addEventListener("error",function(e){if(e.error instanceof DOMException&&e.error.name==="DataCloneError"&&e.message&&e.message.includes("PerformanceServerTiming")){e.stopImmediatePropagation();e.preventDefault()}},true);</script>
    </head>
    <body>
        <noscript>Devi abilitare JavaScript per usare questa app.</noscript>
        <div id="root"></div>

        <!-- Register Service Worker -->
        <script>
            if ('serviceWorker' in navigator) {
                window.addEventListener('load', () => {
                    navigator.serviceWorker.register('/service-worker.js')
                        .then((registration) => {
                            console.log('PWA: Service Worker registrato', registration.scope);
                        })
                        .catch((error) => {
                            console.log('PWA: Registrazione Service Worker fallita', error);
                        });
                });
            }
        </script>

        <!-- Cloudflare Web Analytics -->
        <script defer src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "a283742a83d346fea69b351443892f5e"}'></script>
        <!-- End Cloudflare Web Analytics -->
